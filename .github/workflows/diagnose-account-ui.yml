name: Diagnose account UI JavaScript
on:
  push:
    branches: [hotfix/restore-account-ui]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check inline JS
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.scripts=[]
              def handle_starttag(self,t,a):
                  if t=='script' and not dict(a).get('src'):
                      self.active=True;self.scripts.append('')
              def handle_endtag(self,t):
                  if t=='script':self.active=False
              def handle_data(self,data):
                  if self.active:self.scripts[-1]+=data
          p=P();p.feed(Path('index.html').read_text())
          for i,js in enumerate(p.scripts):
              out=Path('/tmp/inline-'+str(i)+'.js')
              out.write_text(js)
              print('Checking',i,'length',len(js))
              import subprocess
              result=subprocess.run(['node','--check',str(out)],text=True,capture_output=True)
              print(result.stdout,result.stderr)
              if result.returncode:exit(result.returncode)
          PY
      - name: Check runtime patch on source
        run: |
          python3 scripts/patch_contextual_reporting.py index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.scripts=[]
              def handle_starttag(self,t,a):
                  if t=='script' and not dict(a).get('src'):
                      self.active=True;self.scripts.append('')
              def handle_endtag(self,t):
                  if t=='script':self.active=False
              def handle_data(self,data):
                  if self.active:self.scripts[-1]+=data
          p=P();p.feed(Path('index.html').read_text())
          for i,js in enumerate(p.scripts):
              out=Path('/tmp/patch-'+str(i)+'.js');out.write_text(js)
              import subprocess
              result=subprocess.run(['node','--check',str(out)],text=True,capture_output=True)
              print('Checking patched',i,'length',len(js),result.stdout,result.stderr)
              if result.returncode:exit(result.returncode)
          PY