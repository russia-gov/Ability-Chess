name: Inspect player name presentation
on:
  push:
    branches: [feature/single-player-name]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find dual name UI elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          for start,end in [(470,535),(4807,4831),(4870,4937),(5688,5712),(6686,6715)]:
            print('==== lines',start,end,'====')
            for j in range(start-1,end):
              print(f'{j+1}: '+s[j][:3500])
          PY