name: Inspect player name presentation
on:
  push:
    branches: [feature/single-player-name]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find dual name UI elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          for start,end in [(806,846),(5090,5140),(5690,5707),(6692,6706)]:
            print('====',start,end)
            for j in range(start-1,end):
              line=s[j]
              if len(line)<6000:print(f'{j+1}: '+line[:3000])
          PY