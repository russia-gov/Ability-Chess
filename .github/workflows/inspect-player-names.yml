name: Inspect player name presentation
on:
  push:
    branches: [feature/single-player-name]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find dual name UI elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          for i,line in enumerate(s):
            if len(line)>7000:continue
            if any(t in line for t in ['memberUsername','memberDisplay','memberName','displayNameInput','usernameInput','memberHandle','create_account','create_profile','signup','signUp','memberSignUp','memberCreate','display_name:','p_display_name']):
              print(str(i+1)+': '+line[:2600])
          PY