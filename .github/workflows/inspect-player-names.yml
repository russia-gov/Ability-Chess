name: Inspect player name presentation
on:
  push:
    branches: [feature/single-player-name]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find dual name UI elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          for i,line in enumerate(s):
            if len(line)>12000:continue
            if r'@${' in line or ('display_name' in line and 'username' in line and i>900):
              print(f'{i+1}: '+line[:1400])
          PY