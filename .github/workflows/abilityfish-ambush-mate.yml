name: AbilityFish Ambush mate regression
on:
  workflow_dispatch:
  push:
    branches: [ abilityfish ]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/abilityfish-ambush-mate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/abilityfish-ambush-mate.yml'

jobs:
  ambush-mate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: fairy-stockfish/Fairy-Stockfish
          ref: c19b5f6c66894fdb0e88d0dd100e3885f744760a
          path: vendor/Fairy-Stockfish
      - run: python3 scripts/prepare_fairy.py vendor/Fairy-Stockfish
      - name: Instrument root state and ability candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Trace the Position handed into ThreadPool::start_thinking and the
          # per-thread root Position after AbilityState transport.
          p=Path('vendor/Fairy-Stockfish/src/thread.cpp')
          s=p.read_text()
          if '#include <iostream>' not in s:
              s=s.replace('#include <cassert>\n','#include <cassert>\n#include <iostream>\n',1)
          a='''      if (pos.abilityfish_active())\n          th->rootPos.ability_state() = pos.ability_state();\n'''
          b='''      if (pos.abilityfish_active())\n          th->rootPos.ability_state() = pos.ability_state();\n      if (th == main())\n          std::cerr << "ABILITYROOTCOPY active=" << pos.abilityfish_active()\n                    << " livePts=" << int(pos.ability_state().side[0].points)\n                    << " liveTurn=" << int(pos.ability_state().turn)\n                    << " liveUsed=" << pos.ability_state().side[0].abilityUsedThisTurn\n                    << " liveEnabled=" << pos.ability_state().abilitiesEnabled\n                    << " rootPts=" << int(th->rootPos.ability_state().side[0].points)\n                    << " rootTurn=" << int(th->rootPos.ability_state().turn)\n                    << " rootUsed=" << th->rootPos.ability_state().side[0].abilityUsedThisTurn\n                    << " rootEnabled=" << th->rootPos.ability_state().abilitiesEnabled\n                    << std::endl;\n'''
          if a not in s: raise SystemExit('thread root copy diagnostic anchor missing')
          p.write_text(s.replace(a,b,1))

          p=Path('vendor/Fairy-Stockfish/src/search.cpp')
          s=p.read_text()
          a='''          auto abilityActions = rootPos.ability_actions();\n          for (const auto& abilityAction : abilityActions)\n'''
          b='''          auto abilityActions = rootPos.ability_actions();\n          if (mainThread)\n              sync_cout << "info string abilityrootdebug actions " << abilityActions.size()\n                        << " pts " << int(rootPos.ability_state().side[0].points)\n                        << " turn " << int(rootPos.ability_state().turn)\n                        << " used " << rootPos.ability_state().side[0].abilityUsedThisTurn\n                        << " enabled " << rootPos.ability_state().abilitiesEnabled << sync_endl;\n          for (const auto& abilityAction : abilityActions)\n'''
          if a not in s: raise SystemExit('root action diagnostic anchor missing')
          s=s.replace(a,b,1)
          a2='''              rootPos.undo_ability_action(abilityUndo);\n\n              if (Threads.stop)\n'''
          b2='''              rootPos.undo_ability_action(abilityUndo);\n\n              if (mainThread)\n                  sync_cout << "info string abilityrootcandidate "\n                            << abilityfish::encode_action(abilityAction)\n                            << " score " << UCI::value(abilityValue)\n                            << " raw " << int(abilityValue)\n                            << " depth " << rootDepth << sync_endl;\n\n              if (Threads.stop)\n'''
          if a2 not in s: raise SystemExit('root candidate diagnostic anchor missing')
          p.write_text(s.replace(a2,b2,1))
          PY
      - working-directory: vendor/Fairy-Stockfish/src
        run: make -j2 build ARCH=x86-64
      - name: Root search finds Ambush then Qb5 mate
        shell: bash
        run: |
          set -euo pipefail
          fen='8/8/k1N5/8/1Q6/8/8/7K w - - 0 1'
          baseline=$(mktemp)
          abilities=$(mktemp)

          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 30 --command uci --command "position fen $fen" \
            --command 'abilityfish on' --command 'abilitypoints 0 0' \
            --command 'go depth 3' 2>&1 | tee "$baseline"
          ! grep -Eq 'score mate 1' "$baseline"

          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 30 --command uci --command "position fen $fen" \
            --command 'abilityfish on' --command 'abilitypoints 4 0' \
            --command 'go depth 3' 2>&1 | tee "$abilities"
          grep -q 'ABILITYROOTCOPY' "$abilities"
          grep -q '^info string abilityrootdebug actions ' "$abilities"
          grep -Eq '^info string abilityaction [0-9]+ score mate [1-9][0-9]* depth ' "$abilities"
          grep -q '^bestmove 0000' "$abilities"
