name: AbilityFish search sanitizer
on:
  workflow_dispatch:
  push:
    branches: [ abilityfish ]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/abilityfish-sanitizer.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/abilityfish-sanitizer.yml'

jobs:
  sanitize-search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: fairy-stockfish/Fairy-Stockfish
          ref: c19b5f6c66894fdb0e88d0dd100e3885f744760a
          path: vendor/Fairy-Stockfish
      - run: python3 scripts/prepare_fairy.py vendor/Fairy-Stockfish
      - name: Build with address/undefined sanitizers
        working-directory: vendor/Fairy-Stockfish/src
        run: make -j2 build ARCH=x86-64 sanitize=address,undefined optimize=no debug=yes
      - name: Ambush capture search regression
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 30 --expect-depth 3 \
            --command uci \
            --command 'position fen 4k3/8/8/3q4/4B3/8/8/4K3 w - - 0 1' \
            --command 'abilityfish on' \
            --command 'abilitypoints 0 0' \
            --command 'abilitytimed ambush b 35 1 1' \
            --command 'go depth 3 searchmoves e4d5'
      - name: Nc3 parent depth-9 regression
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 90 --expect-depth 9 \
            --command uci \
            --command 'position fen rnbqkbnr/pppppppp/8/8/8/2N5/PPPPPPPP/R1BQKBNR b KQkq - 0 1' \
            --command 'abilityfish on' \
            --command 'abilitypoints 0 0' \
            --command 'abilityturn b 1 0 0' \
            --command 'abilityused 0 0' \
            --command 'abilityflags 1 1 3' \
            --command 'abilitylastmove w 1 18 2 1' \
            --command 'go depth 9'
      - name: Nc3 d5 child depth-8 regression
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 90 --expect-depth 8 \
            --command uci \
            --command 'position fen rnbqkbnr/ppp1pppp/8/3p4/8/2N5/PPPPPPPP/R1BQKBNR w KQkq - 0 1' \
            --command 'abilityfish on' \
            --command 'abilitypoints 0 0' \
            --command 'abilityturn w 1 0 0' \
            --command 'abilityused 0 0' \
            --command 'abilityflags 1 1 3' \
            --command 'abilitylastmove w 1 18 2 1' \
            --command 'abilitylastmove b 51 35 65 1' \
            --command 'go depth 8'
