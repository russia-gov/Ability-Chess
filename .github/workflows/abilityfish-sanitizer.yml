name: AbilityFish search sanitizer
on:
  workflow_dispatch:
  push:
    branches: [ abilityfish ]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/abilityfish-sanitizer.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/abilityfish-sanitizer.yml'

jobs:
  sanitize-search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: fairy-stockfish/Fairy-Stockfish
          ref: c19b5f6c66894fdb0e88d0dd100e3885f744760a
          path: vendor/Fairy-Stockfish
      - run: python3 scripts/prepare_fairy.py vendor/Fairy-Stockfish
      - name: Build with address/undefined sanitizers
        working-directory: vendor/Fairy-Stockfish/src
        run: make -j2 build ARCH=x86-64 sanitize=address,undefined optimize=no debug=yes
      - name: Reproduce earned-points Ambush search crash
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 30 \
            --command uci \
            --command 'position fen 4k3/8/8/3q4/4B3/8/8/4K3 w - - 0 1' \
            --command 'abilityfish on' \
            --command 'abilitypoints 0 0' \
            --command 'abilitytimed ambush b 35 1 1' \
            --command 'go depth 3 searchmoves e4d5'
      - name: Install debugger for exact side-mismatch trace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Capture depth-8 side-mismatch backtrace
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          cat > /tmp/abilityfish-commands.txt <<'EOF'
          uci
          position fen rnbqkbnr/ppp1pppp/8/3p4/8/2N5/PPPPPPPP/R1BQKBNR w KQkq - 0 1
          abilityfish on
          abilitypoints 0 0
          abilityturn w 1 0 0
          abilityused 0 0
          abilityflags 1 1 3
          abilitylastmove w 1 18 2 1
          abilitylastmove b 51 35 65 1
          go depth 8
          EOF
          rm -f /tmp/abilityfish-input
          mkfifo /tmp/abilityfish-input
          { cat /tmp/abilityfish-commands.txt; sleep 30; } > /tmp/abilityfish-input &
          writer=$!
          set +e
          gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'handle SIGABRT stop print nopass' \
            -ex 'run < /tmp/abilityfish-input' \
            -ex 'thread apply all bt full' \
            --args vendor/Fairy-Stockfish/src/stockfish 2>&1 | tee /tmp/abilityfish-gdb.log
          rc=${PIPESTATUS[0]}
          set -e
          kill "$writer" 2>/dev/null || true
          grep -q 'Position::gives_check' /tmp/abilityfish-gdb.log
          exit 1
