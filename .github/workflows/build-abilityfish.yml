name: Build AbilityFish development engine
on:
  workflow_dispatch:
  push:
    branches: [ abilityfish ]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/build-abilityfish.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/build-abilityfish.yml'

jobs:
  native-rule-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run AbilityFish native rule tests
        run: bash engine/tests/run-native-tests.sh

  fairy-native-integration:
    runs-on: ubuntu-24.04
    needs: native-rule-tests
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned Fairy-Stockfish
        uses: actions/checkout@v6
        with:
          repository: fairy-stockfish/Fairy-Stockfish
          ref: c19b5f6c66894fdb0e88d0dd100e3885f744760a
          path: vendor/Fairy-Stockfish
      - name: Apply AbilityFish integration
        run: python3 scripts/prepare_fairy.py vendor/Fairy-Stockfish
      - name: Compile native Fairy-Stockfish with AbilityFish hooks
        working-directory: vendor/Fairy-Stockfish/src
        run: make -j2 build ARCH=x86-64
      - name: Root ability transport smoke test
        run: |
          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 30 \
            --command uci \
            --command 'position fen 4k3/8/8/3q4/4R3/8/8/4K3 w - - 0 1' \
            --command 'abilityfish on' \
            --command 'abilitypoints 4 0' \
            --command 'go depth 3'
      - name: AbilityFish depth-15 recursion smoke test
        run: |
          python3 scripts/run_uci_search.py vendor/Fairy-Stockfish/src/stockfish \
            --timeout 120 \
            --expect-depth 15 \
            --command uci \
            --command 'position fen 4k3/8/8/8/8/8/8/1N2K3 w - - 0 1' \
            --command 'abilityfish on' \
            --command 'abilitypoints 3 0' \
            --command 'go depth 15'

  fairy-wasm-kernel-build:
    runs-on: ubuntu-24.04
    needs: fairy-native-integration
    env:
      EM_VERSION: 2.0.26
      EM_CACHE_FOLDER: emsdk-cache
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned interactive Fairy-Stockfish WASM port
        uses: actions/checkout@v6
        with:
          repository: fairy-stockfish/fairy-stockfish.wasm
          ref: 2e874fd689e35e23253c1ef5cfb5065314c24354
          path: vendor/Fairy-Wasm
          fetch-depth: 0
      - name: Verify WASM port contains pinned Fairy source revision
        run: |
          test "$(git -C vendor/Fairy-Wasm rev-parse 2e874fd689e35e23253c1ef5cfb5065314c24354^2)" = "c19b5f6c66894fdb0e88d0dd100e3885f744760a"
      - name: Apply AbilityFish integration to interactive WASM source
        run: python3 scripts/prepare_fairy.py vendor/Fairy-Wasm
      - uses: actions/cache@v5
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: abilityfish-uci-emsdk-${{ env.EM_VERSION }}-${{ runner.os }}
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - name: Compile patched interactive Fairy UCI runtime to WASM
        run: |
          make -C vendor/Fairy-Wasm/src -j2 emscripten_build ARCH=wasm \
            nnue=no embedded_nnue=no wasm_simd=no largeboards=no all=no
      - name: Collect interactive AbilityFish WASM runtime
        run: |
          mkdir -p dist
          cp vendor/Fairy-Wasm/src/emscripten/public/stockfish.js dist/abilityfish-stockfish.js
          cp vendor/Fairy-Wasm/src/emscripten/public/stockfish.wasm dist/abilityfish-stockfish.wasm
          cp vendor/Fairy-Wasm/src/emscripten/public/stockfish.worker.js dist/abilityfish-stockfish.worker.js
          cp engine/fairy-depth15-worker.js dist/abilityfish-worker.js
          cp engine/abilityfish-bridge.js dist/abilityfish-bridge.js
          cp engine/WASM_RUNTIME_STATUS.md dist/WASM_RUNTIME_STATUS.md
      - uses: actions/upload-artifact@v7
        with:
          name: abilityfish-development-wasm
          path: dist/*
          if-no-files-found: error
