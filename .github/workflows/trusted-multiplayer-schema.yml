name: Trusted multiplayer state schema checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/trusted-multiplayer-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/tests/*.test.js
