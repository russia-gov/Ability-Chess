name: Verified online two-client browser regression
on:
  push:
    branches: [security/server-authoritative-gameplay-foundation-2026]
    paths:
      - 'index.html'
      - 'client/verified-online-transport.js'
      - 'scripts/run_verified_online_browser_smoke.js'
      - '.github/workflows/verified-online-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'client/verified-online-transport.js'
      - 'scripts/run_verified_online_browser_smoke.js'
      - '.github/workflows/verified-online-browser.yml'
permissions:
  contents: read
jobs:
  two-clients:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check client/verified-online-transport.js
          node --check scripts/run_verified_online_browser_smoke.js
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/run_verified_online_browser_smoke.js
