name: Inspect UI hooks (temporary)
on:
  push:
    branches: [feature/admin-message-context-reporting]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find message and admin UI code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          lines=s.splitlines()
          chunks=[(220,257),(570,620),(5400,5460),(5600,5638),(5640,5710),(5710,5745),(5760,5835)]
          for a,b in chunks:
            print('====',a,'-',b,'====')
            for n in range(a-1,min(len(lines),b)):
              print(str(n+1)+': '+lines[n][:2500])
          PY